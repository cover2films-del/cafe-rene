name: Publish mobile preview update
on:
  push:
    branches: [feat/rene-demo]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-preview-update.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-preview-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check Expo access is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Add EXPO_TOKEN in repository Settings > Secrets and variables > Actions to enable EAS publishing.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - name: Publish to the preview channel
        working-directory: apps/mobile
        run: eas update --channel preview --environment preview --platform all --message "GitHub $GITHUB_SHA" --non-interactive
